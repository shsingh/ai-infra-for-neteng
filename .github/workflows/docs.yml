name: docs
# Build the Sphinx lab-guides site (AppWorld pattern: f5_sphinx_theme + MyST).
# Deploy to GitHub Pages on master. Locally the same render runs via:
#   cd docs && make html        (or)   nix run .#docs   (offline-capable, pinned toolchain)
on:
  pull_request:
    paths: ["docs/**", "course/**", "PLAN.md", ".github/workflows/docs.yml"]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned Sphinx toolchain
        run: pip install -r docs/requirements.txt

      - name: Build site (warning-clean)
        run: make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Upload Pages artifact (on master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
